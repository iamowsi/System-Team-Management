services:
  postgres:
    image: postgres:16-alpine
    container_name: tm_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: task_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d task_manager']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tm_redis
    ports:
      - '6379:6379'

  s3:
    image: localstack/localstack:3.8
    container_name: tm_s3
    ports:
      - '9000:4566'
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - s3_data:/var/lib/localstack

  mailpit:
    image: axllent/mailpit
    container_name: tm_mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  backend:
    build:
      context: ./team-task-manager
      dockerfile: Dockerfile
    container_name: tm_backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/task_manager?schema=public
      JWT_SECRET: super-secret-jwt-key-2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://s3:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: task-attachments
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./team-task-manager-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: tm_frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  s3_data: