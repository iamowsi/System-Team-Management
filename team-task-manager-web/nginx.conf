server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # هدایت تمام مسیرهای React Router به index.html (جلوگیری از خطای 404 هنگام Refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # کش کردن فایل‌های استاتیک (CSS, JS, تصاویر) برای سرعت بالاتر
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}