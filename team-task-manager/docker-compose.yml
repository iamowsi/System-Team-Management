services:
  postgres:
    image: postgres:16-alpine
    container_name: tm_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: task_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tm_redis
    ports:
      - '6379:6379'

  s3:
    image: localstack/localstack:3.8
    container_name: tm_s3
    ports:
      - '9000:4566'
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - s3_data:/var/lib/localstack

  mailpit:
    image: axllent/mailpit
    container_name: tm_mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  s3_data:
